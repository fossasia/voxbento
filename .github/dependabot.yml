version: 2

updates:
  # Python dependencies (uv / pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    open-pull-requests-limit: 15
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

  # Dockerfiles in the repository root (portal Python base image)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"

  # Docker Compose images (MediaMTX and the lockstep Jitsi stack)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "docker"
    groups:
      jitsi:
        patterns:
          - "ghcr.io/jitsi/web"
          - "ghcr.io/jitsi/prosody"
          - "ghcr.io/jitsi/jicofo"
          - "ghcr.io/jitsi/jvb"
    commit-message:
      prefix: "deps(compose)"

  # The floor bot has its own nested Dockerfile and Playwright base image.
  - package-ecosystem: "docker"
    directory: "/floor-bot"
    schedule:
      interval: "daily"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(floor-bot)"
