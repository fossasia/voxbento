name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

# Cancel superseded runs on the same PR; allow post-merge and branch pushes to run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────
jobs:

  floor-bot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect floor-bot and smoke-test changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || \
             [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            if ! git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
              echo "Base commit $BASE_SHA is unavailable; running floor-bot checks conservatively."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git diff --name-only "$BASE_SHA" HEAD > /tmp/floor-bot-changed-files
            if grep -Eq '^(floor-bot/|docker-compose\.yml$|\.github/workflows/tests\.yml$|tests/(floor_bot_container_smoke|check_floor_bot_image_size|test_floor_bot_dependencies)\.py$)' /tmp/floor-bot-changed-files; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check floor-bot base image download budget
        if: steps.changes.outputs.changed == 'true'
        run: python3 tests/check_floor_bot_image_size.py

      - name: Build floor-bot image
        if: steps.changes.outputs.changed == 'true'
        run: docker build --platform linux/amd64 -t voxbento-floor-bot-ci ./floor-bot

      - name: Start floor bot with its production entrypoint
        if: steps.changes.outputs.changed == 'true'
        run: |
          docker network create floor-bot-ci
          docker run -d --name floor-bot-mtx --network floor-bot-ci \
            bluenviron/mediamtx:1.18.2
          docker run -d --name floor-bot-ci --network floor-bot-ci \
            -v "$PWD/tests/floor_bot_container_smoke.py:/tmp/floor_bot_container_smoke.py:ro" \
            voxbento-floor-bot-ci

      - name: Verify real Chromium audio capture and room lifecycle
        if: steps.changes.outputs.changed == 'true'
        run: docker exec floor-bot-ci python /tmp/floor_bot_container_smoke.py

      - name: Dump floor-bot logs on failure
        if: failure()
        run: |
          docker logs floor-bot-ci || true
          docker logs floor-bot-mtx || true

      - name: Remove floor-bot smoke container
        if: always()
        run: |
          docker rm -f floor-bot-ci floor-bot-mtx || true
          docker network rm floor-bot-ci || true

  # Real-media gate for RTMPS relay mode (#749): the pinned MediaMTX release calls the real
  # /internal/media-auth hook; nothing is mocked between the encoder, MediaMTX and the relay.
  program-relay-media:
    name: program-relay-media (MediaMTX 1.18.2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_KEY_ENCRYPTION_KEY: "ci-test-encryption-key-must-be-32-chars-long"
      PROGRAM_RELAY_MEDIA_REQUIRED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install FFmpeg (libx264, AAC, TLS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -protocols | grep -qw rtmps
          ffmpeg -hide_banner -encoders | grep -qw libx264

      - name: Install pinned MediaMTX 1.18.2
        run: |
          mkdir -p "$RUNNER_TEMP/mediamtx"
          curl -fsSL https://github.com/bluenviron/mediamtx/releases/download/v1.18.2/mediamtx_v1.18.2_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/mediamtx"
          "$RUNNER_TEMP/mediamtx/mediamtx" --version | grep -qx v1.18.2
          echo "MEDIAMTX_TEST_BINARY=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"

      - name: Sync dependencies (including dev)
        run: uv sync --all-groups

      - name: RTMPS auth, revoke, forwarding and destination-failure tests
        run: uv run pytest tests/test_program_relay_media.py -v

  # Builds the program-relay image and runs it with the production hardening from
  # docker-compose.relay.yml: TLS verification, CA bundle, forwarding and cleanup.
  program-relay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_CONTROL_SECRET: ci-program-relay-control-secret-0123456789abcdef
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build program-relay image
        run: docker build --platform linux/amd64 -t voxbento-program-relay-ci ./program-relay

      - name: Create a CI CA, a CA-signed sink cert and an untrusted self-signed cert
        run: |
          CERTS="$RUNNER_TEMP/relay-certs"
          mkdir -p "$CERTS/trusted" "$CERTS/untrusted"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj "/CN=VoxBento CI CA" -keyout "$CERTS/ca.key" -out "$CERTS/ca.crt"
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -subj "/CN=mtx" \
            -keyout "$CERTS/trusted/server.key" -out "$RUNNER_TEMP/mtx.csr"
          printf 'subjectAltName=DNS:mtx\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > "$RUNNER_TEMP/mtx.ext"
          openssl x509 -req -in "$RUNNER_TEMP/mtx.csr" -CA "$CERTS/ca.crt" -CAkey "$CERTS/ca.key" \
            -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/mtx.ext" -out "$CERTS/trusted/server.crt"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj "/CN=mtx-untrusted" -addext "subjectAltName=DNS:mtx-untrusted" \
            -keyout "$CERTS/untrusted/server.key" -out "$CERTS/untrusted/server.crt"
          chmod -R a+rX "$CERTS"
          cat > "$RUNNER_TEMP/mediamtx.yml" <<'YML'
          logLevel: info
          api: yes
          apiAddress: :9997
          authInternalUsers:
            - user: any
              pass:
              ips: []
              permissions:
                - action: publish
                - action: read
                - action: api
          rtspTransports: [tcp]
          rtmp: yes
          rtmpEncryption: strict
          rtmpsAddress: :1936
          rtmpServerKey: /certs/server.key
          rtmpServerCert: /certs/server.crt
          webrtc: no
          hls: no
          srt: no
          paths:
            all_others:
          YML

      - name: Start MediaMTX sinks and the hardened relay
        run: |
          docker network create relay-ci
          for name in mtx mtx-untrusted; do
            dir=trusted; [ "$name" = mtx-untrusted ] && dir=untrusted
            docker run -d --name "$name" --network relay-ci \
              -v "$RUNNER_TEMP/relay-certs/$dir:/certs:ro" \
              -v "$RUNNER_TEMP/mediamtx.yml:/mediamtx.yml:ro" \
              bluenviron/mediamtx:1.18.2
          done
          docker run -d --name relay --network relay-ci \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e RELAY_CONTROL_SECRET -e RELAY_SOURCE_BASE=rtsp://mtx:8554 \
            -e RELAY_ALLOWED_HOSTS=mtx,mtx-untrusted -e RELAY_CA_FILE=/ci-ca/ca.crt \
            -v "$RUNNER_TEMP/relay-certs/ca.crt:/ci-ca/ca.crt:ro" \
            -v "$PWD/tests/program_relay_container_smoke.py:/smoke/program_relay_container_smoke.py:ro" \
            voxbento-program-relay-ci
          sleep 3
          docker ps

      - name: Verify FFmpeg, CA bundle, verified forwarding and lifecycle in the container
        run: docker exec -e RELAY_CONTROL_SECRET relay python /smoke/program_relay_container_smoke.py

      - name: Dump program-relay logs on failure
        if: failure()
        run: |
          docker logs relay || true
          docker logs mtx || true
          docker logs mtx-untrusted || true

      - name: Remove program-relay smoke containers
        if: always()
        run: |
          docker rm -f relay mtx mtx-untrusted || true
          docker network rm relay-ci || true

  # ── 1. Unit tests + lint (fast, no Docker) ───────────────────
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    env:
      API_KEY_ENCRYPTION_KEY: "ci-test-encryption-key-must-be-32-chars-long"
      MEDIAMTX_AUTH_HOOK_SECRET: "ci-test-mediamtx-hook-secret"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (including dev)
        run: uv sync --all-groups

      - name: Install WebKit browser binary and OS dependencies (#995)
        run: uv run playwright install --with-deps webkit

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Validate JS syntax
        run: |
          node --check portal/static/js/interpreter-booth.js
          node --check portal/static/js/booth-reconnect.js
          node --check portal/static/js/whep-listener.js
          node --check portal/static/js/admin.js
          node --check .github/scripts/jules-review.mjs
      - name: run node tests
        run: |
          node tests/test_audio_scheduler.js
          node tests/test_tts_parser.js
          node tests/test_listener_event.js
          node tests/test_whep_listener.js
          node tests/test_jules_review.mjs
          node tests/test_booth_reconnect.mjs
          node tests/test_booth_socket.mjs
          node tests/test_room_ai.mjs

      - name: Run unit tests
        run: uv run pytest tests/ -v

  # ── 2. Docker build + full-stack smoke test ──────────────────
  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests          # only build images if unit tests pass

    # All host-facing URLs derived from CI_HOST. Change this single value
    # if the runner network setup ever differs.
    env:
      CI_HOST: localhost
      PORTAL_PORT: 8000
      WEBRTC_PORT: 8889
      MEDIAMTX_API_PORT: 9997
      JITSI_HTTP_PORT: 8080
      SECRET_KEY: ci-test-secret-key-not-for-production
      BOOTH_ACCESS_TOKEN: ci-test-token-generated-with-openssl-rand-hex-32
      JVB_ADVERTISE_IPS: 127.0.0.1
      JITSI_DOMAIN: localhost:8080
      MEDIAMTX_WHIP_BASE: http://localhost:8889
      MEDIAMTX_API_BASE: http://mediamtx:9997
      MEDIAMTX_AUTH_HOOK_SECRET: ci-test-mediamtx-hook-secret
      API_KEY_ENCRYPTION_KEY: "ci-test-encryption-key-must-be-32-chars-long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Compose configuration
        run: |
          test -n "$MEDIAMTX_AUTH_HOOK_SECRET"
          docker compose config --quiet

      # ── Shared helpers ──────────────────────────────────────
      # wait_for_url  URL  LABEL  [MAX_ATTEMPTS]  [ACCEPT_CODES]
      #   Polls URL until it returns one of ACCEPT_CODES (default: any
      #   non-000 response). Fails after MAX_ATTEMPTS * 3 seconds.
      - name: Define CI helper functions
        run: |
          cat > /tmp/ci-helpers.sh << 'HELPERS'
          wait_for_url() {
            local url="$1" label="$2" max="${3:-20}" accept="${4:-any}"
            echo "Waiting for $label ($url)..."
            for i in $(seq 1 "$max"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || echo "000")
              if [ "$accept" = "any" ]; then
                [ "$code" != "000" ] && { echo "$label is up (HTTP $code)!"; return 0; }
              else
                echo "$accept" | tr ',' '\n' | grep -qx "$code" && { echo "$label is up (HTTP $code)!"; return 0; }
              fi
              echo "  attempt $i/$max: HTTP $code"
              sleep 3
            done
            echo "ERROR: $label did not respond within $(( max * 3 ))s"
            return 1
          }

          assert_http() {
            local url="$1" label="$2" expected="${3:-200}"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$label → HTTP $code"
            [ "$code" = "$expected" ] || { echo "FAIL: expected $expected"; return 1; }
          }
          HELPERS

      # ── Build all images ────────────────────────────────────
      - name: Build portal image
        run: docker compose build portal

      # ── Start the full stack ────────────────────────────────
      - name: Start all services
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      # ── Wait for health ─────────────────────────────────────
      - name: Wait for portal to be healthy
        run: |
          echo "Waiting for portal healthcheck..."
          for i in $(seq 1 30); do
            health=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q portal)" 2>/dev/null || echo "missing")
            echo "  attempt $i: $health"
            if [ "$health" = "healthy" ]; then
              echo "Portal is healthy!"
              exit 0
            fi
            sleep 3
          done
          echo "ERROR: Portal did not become healthy within 90 seconds"
          docker compose logs portal
          exit 1

      - name: Wait for MediaMTX and Jitsi
        run: |
          source /tmp/ci-helpers.sh
          wait_for_url "http://${CI_HOST}:${WEBRTC_PORT}/"                "MediaMTX WebRTC"      20
          wait_for_url "http://${CI_HOST}:${MEDIAMTX_API_PORT}/v3/paths/list" "MediaMTX Control API" 20
          wait_for_url "http://${CI_HOST}:${JITSI_HTTP_PORT}/"            "Jitsi web"            30 "200,301,302"

      # ── Smoke tests — hit every endpoint ────────────────────
      - name: Portal health endpoint
        run: |
          resp=$(curl -sf "http://${CI_HOST}:${PORTAL_PORT}/healthz")
          echo "$resp"
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'], 'healthz not ok'"

      - name: Portal page endpoints
        run: |
          source /tmp/ci-helpers.sh
          # Booth pages now require auth — unauthenticated requests redirect to /login
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/interpreter/ci-event/1/en" \
                      "GET /interpreter/ci-event/1/en (no auth → 303)" "303"


      - name: Portal ingest-status API
        run: |
          resp=$(curl -sf "http://${CI_HOST}:${PORTAL_PORT}/api/interpreter/status/ci-booth-audio")
          echo "$resp"
          echo "$resp" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['channel_id']=='ci-booth-audio'; assert 'reachable' in d"

      - name: MediaMTX Control API lists paths
        run: |
          resp=$(curl -sf "http://${CI_HOST}:${MEDIAMTX_API_PORT}/v3/paths/list")
          echo "$resp"
          echo "$resp" | python3 -c "import sys,json; json.load(sys.stdin)"

      - name: Static JS files are served
        run: |
          source /tmp/ci-helpers.sh
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/static/js/interpreter-booth.js" "interpreter-booth.js"
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/static/js/whep-listener.js"     "whep-listener.js"
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/static/js/admin.js"             "admin.js"
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/static/css/admin.css"           "admin.css"

      # ── Auth & admin panel smoke tests ──────────────────────
      - name: Home page, login, register render
        run: |
          source /tmp/ci-helpers.sh
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/"         "GET /"
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/login"    "GET /login"
          assert_http "http://${CI_HOST}:${PORTAL_PORT}/register" "GET /register"

      - name: Admin panel login and CRUD smoke test
        run: |
          BASE="http://${CI_HOST}:${PORTAL_PORT}"

          # Retired admin sign-in page redirects to the shared sign-in page (#752)
          loc=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${BASE}/admin/login")
          echo "GET /admin/login → $loc"
          [ "$loc" = "303 ${BASE}/login?next=/admin/" ] || { echo "FAIL"; exit 1; }

          # Bootstrap a per-user administrator for this isolated smoke-test DB.
          docker compose exec -T portal uv run python - <<'PY'
          import asyncio

          from portal.auth import hash_password
          from portal.database import create_user, get_session


          async def bootstrap() -> None:
              async with get_session() as session:
                  await create_user(
                      session,
                      email="ci-admin@example.com",
                      display_name="CI Admin",
                      password_hash=hash_password("ci-admin-pass"),
                      is_admin=True,
                      email_verified=True,
                  )


          asyncio.run(bootstrap())
          PY

          # Admin signs in on the shared page → redirect to /admin/ + user_token cookie
          resp=$(curl -s -D - -o /dev/null -X POST "${BASE}/login" \
            -d "email=ci-admin%40example.com&password=ci-admin-pass&next_url=%2Fadmin%2F")
          echo "$resp" | head -5
          echo "$resp" | grep -qi "^location: /admin/" || { echo "FAIL: not redirected to /admin/"; exit 1; }
          echo "$resp" | grep -qi "set-cookie.*user_token" || { echo "FAIL: no user_token cookie"; exit 1; }

          # Extract the user_token cookie
          ADMIN_COOKIE=$(echo "$resp" | grep -i 'set-cookie.*user_token' | sed 's/.*user_token=\([^;]*\).*/\1/')
          echo "Admin user token: ${ADMIN_COOKIE:0:20}..."

          # Dashboard loads
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "user_token=${ADMIN_COOKIE}" "${BASE}/admin/")
          echo "GET /admin/ → $code"
          [ "$code" = "200" ] || { echo "FAIL"; exit 1; }

          # Create event
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -b "user_token=${ADMIN_COOKIE}" \
            -d "slug=ci-smoke&display_name=CI+Smoke+Test" "${BASE}/admin/events/")
          echo "POST /admin/events/ → $code"
          [ "$code" = "303" ] || { echo "FAIL"; exit 1; }

          # Events list renders
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "user_token=${ADMIN_COOKIE}" "${BASE}/admin/events/")
          echo "GET /admin/events/ → $code"
          [ "$code" = "200" ] || { echo "FAIL"; exit 1; }

          # Users list renders
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "user_token=${ADMIN_COOKIE}" "${BASE}/admin/users/")
          echo "GET /admin/users/ → $code"
          [ "$code" = "200" ] || { echo "FAIL"; exit 1; }

          # Admin without cookie → 403
          code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/admin/")
          echo "GET /admin/ (no cookie) → $code"
          [ "$code" = "403" ] || { echo "FAIL: expected 403"; exit 1; }

      - name: User registration and login smoke test
        run: |
          BASE="http://${CI_HOST}:${PORTAL_PORT}"

          # Register a new user
          resp=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${BASE}/register" \
            -d "email=ci-test@example.com&display_name=CI+User&password=securepass123&password_confirm=securepass123")
          echo "POST /register → $resp"
          [ "$resp" = "200" ] || { echo "FAIL: expected 200 after register"; exit 1; }

          # Manually verify the user's email since we can't click the magic link in CI
          docker exec $(docker compose ps -q portal) uv run python -c "
          import asyncio
          from portal.database import get_session, update_user, get_user_by_email
          async def verify():
              async with get_session() as s:
                  u = await get_user_by_email(s, 'ci-test@example.com')
                  await update_user(s, u.id, email_verified=True)
          asyncio.run(verify())
          "

          # Login with the registered user
          resp=$(curl -s -D - -o /dev/null -X POST "${BASE}/login" \
            -d "email=ci-test@example.com&password=securepass123")
          echo "$resp" | head -5
          echo "$resp" | grep -qi "set-cookie.*user_token" || { echo "FAIL: no user_token after login"; exit 1; }

          # Extract user token and check account page
          USER_COOKIE=$(echo "$resp" | grep -i 'set-cookie.*user_token' | sed 's/.*user_token=\([^;]*\).*/\1/')
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "user_token=${USER_COOKIE}" "${BASE}/account")
          echo "GET /account → $code"
          [ "$code" = "200" ] || { echo "FAIL"; exit 1; }

          # Login with wrong password → 403
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${BASE}/login" \
            -d "email=ci-test@example.com&password=wrong")
          echo "POST /login (wrong pw) → $code"
          [ "$code" = "403" ] || { echo "FAIL: expected 403"; exit 1; }

          # Account without cookie → redirect to login
          code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/account")
          echo "GET /account (no cookie) → $code"
          [ "$code" = "303" ] || { echo "FAIL: expected 303 redirect"; exit 1; }



          # With a valid user_token but no event membership → 403 on interpreter page
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "user_token=${USER_COOKIE}" \
            "${BASE}/interpreter/ci-smoke/1/en")
          echo "GET /interpreter/ci-smoke/1/en (user, no membership) → $code"
          [ "$code" = "403" ] || { echo "FAIL: expected 403 without membership"; exit 1; }



      # ── Collect logs on failure ─────────────────────────────
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
