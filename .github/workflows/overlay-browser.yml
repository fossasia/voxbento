name: Overlay browser

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".github/workflows/overlay-browser.yml"
      - "tests/overlay_browser_smoke.py"
      - "portal/**/*overlay*"
      - "portal/routers/admin.py"
      - "portal/routers/listener.py"
      - "portal/workspace_routing.py"
      - "portal/websockets/**"
      - "portal/auth.py"
      - "portal/join_code_limit.py"
      - "portal/templates/admin/event_detail.html"
      - "portal/static/css/tokens.css"
      - "portal/static/css/fonts.css"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/overlay-browser.yml"
      - "tests/overlay_browser_smoke.py"
      - "portal/**/*overlay*"
      - "portal/routers/admin.py"
      - "portal/routers/listener.py"
      - "portal/workspace_routing.py"
      - "portal/websockets/**"
      - "portal/auth.py"
      - "portal/join_code_limit.py"
      - "portal/templates/admin/event_detail.html"
      - "portal/static/css/tokens.css"
      - "portal/static/css/fonts.css"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:

# Cancel superseded runs on the same PR; allow post-merge and branch pushes to run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────
jobs:

  overlay-browser:
    runs-on: ubuntu-24.04
    # Match the Python package below to the browsers bundled in this image.
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .github/workflows/overlay-browser.yml
      - name: Install project dependencies
        run: uv sync --python 3.13 --dev --frozen
      - name: Verify overlay over real HTTP and WebSockets
        env:
          PYTHONPATH: .
          OVERLAY_ARTIFACT_DIR: overlay-browser-artifacts
        run: uv run --with playwright==1.58.0 python tests/overlay_browser_smoke.py
      - name: Upload overlay rehearsal recording and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: overlay-browser-rehearsal
          path: overlay-browser-artifacts/
          retention-days: 7
