name: Listener browser

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
    paths:
      - ".github/workflows/listener-browser.yml"
      - "tests/listener_channel_switch_browser.py"
      - "tests/browser_harness.py"
      - "portal/routers/listener.py"
      - "portal/templates/listener-event.html"
      - "portal/static/js/whep-listener.js"
      - "portal/static/js/listener-event.js"
      - "portal/static/js/program-delivery.js"
      - "portal/static/js/tts-parser.js"
      - "portal/static/js/audio-scheduler.js"
      - "portal/static/js/brutal-select.js"
      - "portal/websockets/**"
      - "portal/join_code_limit.py"
      - "portal/auth.py"
      - "pyproject.toml"
      - "uv.lock"

  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/listener-browser.yml"
      - "tests/listener_channel_switch_browser.py"
      - "tests/browser_harness.py"
      - "portal/routers/listener.py"
      - "portal/templates/listener-event.html"
      - "portal/static/js/whep-listener.js"
      - "portal/static/js/listener-event.js"
      - "portal/static/js/program-delivery.js"
      - "portal/static/js/tts-parser.js"
      - "portal/static/js/audio-scheduler.js"
      - "portal/static/js/brutal-select.js"
      - "portal/websockets/**"
      - "portal/join_code_limit.py"
      - "portal/auth.py"
      - "pyproject.toml"
      - "uv.lock"

  workflow_dispatch:
    inputs:
      runs:
        description: "Consecutive runs of the rehearsal (use 10 to check for flakiness)"
        required: false
        default: "1"

# Cancel superseded runs on the same PR; allow post-merge and branch pushes to run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────
jobs:

  listener-channel-switch:
    runs-on: ubuntu-24.04
    # Match the Python package below to the browsers bundled in this image.
    container: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .github/workflows/listener-browser.yml
      - name: Install project dependencies
        run: uv sync --python 3.13 --dev --frozen
      - name: Switch listener channels over real HTTP, WebSockets and WebRTC
        env:
          PYTHONPATH: .
          LISTENER_ARTIFACT_DIR: listener-browser-artifacts
          BROWSER_TEST_RUNS: ${{ inputs.runs || '1' }}
        run: uv run --with playwright==1.58.0 python tests/listener_channel_switch_browser.py
      - name: Upload listener rehearsal recording and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: listener-browser-rehearsal
          path: listener-browser-artifacts/
          retention-days: 7
