name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  # Manual trigger for rollbacks / forced re-deploy
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy — finish it

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: SSH deploy → voxbento.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for reference — actual code pull happens on server)
        uses: actions/checkout@v7.0.1

      # ── SSH into the production server and pull latest code ──────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          # Timeout: 5 minutes (alembic migrations + docker restart can take ~60s)
          command_timeout: 5m
          script: |
            set -e

            echo "=== Deploying to production: $(date) ==="
            cd "${VOXBENTO_DIR:-$HOME/voxbento}"

            # Validate in a separate checkout: the current portal may still bind
            # the live source directory until this deployment replaces it.
            deployment_dir="$PWD"
            # Last value of KEY in the live .env, without surrounding quotes.
            env_value() { sed -n "s/^$1=//p" "$deployment_dir/.env" | tail -n 1 | tr -d "\"'"; }
            portal_port=$(env_value PORTAL_HOST_PORT)
            portal_port=${portal_port:-8000}
            case "$portal_port" in
              ''|*[!0-9]*) echo "ERROR: PORTAL_HOST_PORT must be a port number"; exit 1 ;;
            esac
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            candidate_commit=$(git rev-parse origin/main)
            candidate_dir=$(mktemp -d "${TMPDIR:-/tmp}/voxbento-deploy.XXXXXX")
            git worktree add --detach "$candidate_dir" "$candidate_commit"
            trap 'git -C "$deployment_dir" worktree remove --force "$candidate_dir"' EXIT
            cd "$candidate_dir"
            umask 077
            cp "$deployment_dir/.env" .env

            # Host-local Compose overrides named in COMPOSE_FILE but not tracked in Git
            # live only in the deployment directory; the candidate needs them too.
            compose_files=$(env_value COMPOSE_FILE)
            for compose_file in $(printf '%s' "$compose_files" | tr ':' ' '); do
              case "$compose_file" in /*|*..*) continue ;; esac
              if [ ! -e "$compose_file" ] && [ -f "$deployment_dir/$compose_file" ]; then
                cp "$deployment_dir/$compose_file" "$compose_file"
                echo "Using host-local $compose_file"
              fi
            done

            # Keep image tags, networks and persistent volumes under the existing
            # project name even when Compose runs in a temporary checkout.
            compose() { docker compose --project-name voxbento "$@"; }
            echo "--- building deployment images ---"
            compose build

            echo "--- validating production configuration ---"
            compose run --rm --no-deps portal \
              uv run python -c \
              "from portal.config import settings; settings.validate_production_secrets()"

            # The repo Caddyfile holds only VoxBento's sites. It is installed as
            # /etc/caddy/sites/voxbento.caddy, imported by the host's main Caddyfile,
            # so other apps on the same server keep their own site files.
            caddy_site="$candidate_dir/.voxbento.caddy"
            if [ -f Caddyfile ]; then
              sed "s/reverse_proxy localhost:8000 /reverse_proxy localhost:$portal_port /" \
                Caddyfile > "$caddy_site"
              sudo caddy validate --config "$caddy_site" --adapter caddyfile
            fi

            # YouTube relay mode lives in docker-compose.relay.yml, selected by COMPOSE_FILE
            # in .env. Never let a deploy without it remove a running relay (--remove-orphans).
            relay_running=$(docker ps -q --filter label=com.docker.compose.project=voxbento \
              --filter label=com.docker.compose.service=program-relay)
            if [ -n "$relay_running" ] && ! compose config --services | grep -qx program-relay; then
              echo "ERROR: program-relay is running but this deploy would remove it."
              echo "Add COMPOSE_FILE=docker-compose.yml:docker-compose.relay.yml to .env"
              echo "(or run scripts/setup-youtube-relay.sh), then re-run the deploy."
              exit 1
            fi
            # RTMPS-only ingest lives in docker-compose.rtmps.yml (the relay file also opens it).
            # Never let a deploy without either file close a listening RTMPS port.
            # `compose` is the project-scoped `docker compose` wrapper defined above.
            rtmps_open=$(docker ps -q --filter label=com.docker.compose.project=voxbento \
              --filter label=com.docker.compose.service=mediamtx --filter publish=1936)
            if [ -n "$rtmps_open" ] && ! compose config | grep -q MTX_RTMPSADDRESS; then
              echo "ERROR: MediaMTX accepts RTMPS on 1936 but this deploy would close it."
              echo "Add docker-compose.rtmps.yml (or docker-compose.relay.yml) to COMPOSE_FILE in .env"
              echo "(or run scripts/setup-youtube-relay.sh --ingest-only), then re-run the deploy."
              exit 1
            fi

            # Only advance the live checkout after all preflight checks pass.
            cd "$deployment_dir"
            git checkout main
            git merge --ff-only "$candidate_commit"
            if [ -f "$caddy_site" ]; then
              caddy_import='import /etc/caddy/sites/*.caddy'
              sudo install -d -m 755 /etc/caddy/sites
              # Renames on the same filesystem: Caddy must never read a partial copy.
              # The .next name does not match the import glob.
              sudo install -m 644 "$caddy_site" /etc/caddy/sites/voxbento.caddy.next
              caddy_migrated=
              if ! sudo grep -qxF "$caddy_import" /etc/caddy/Caddyfile; then
                # One-time move from the old layout, where deploys owned the whole main file.
                if ! sudo grep -qF 'Caddyfile — voxbento.com production' /etc/caddy/Caddyfile; then
                  echo "ERROR: /etc/caddy/Caddyfile is not managed by VoxBento and does not contain"
                  echo "  $caddy_import"
                  echo "Add that line to it, then re-run the deploy."
                  exit 1
                fi
                sudo install -m 644 /etc/caddy/Caddyfile /etc/caddy/Caddyfile.before-sites
                printf '%s\n' "# Each app on this host owns one file in /etc/caddy/sites/." "$caddy_import" \
                  | sudo tee /etc/caddy/Caddyfile.next > /dev/null
                sudo mv -f /etc/caddy/Caddyfile.next /etc/caddy/Caddyfile
                caddy_migrated=1
                echo "Main Caddyfile now imports /etc/caddy/sites (old copy: Caddyfile.before-sites)"
              fi
              if sudo test -f /etc/caddy/sites/voxbento.caddy; then
                sudo install -m 644 /etc/caddy/sites/voxbento.caddy /etc/caddy/sites/voxbento.caddy.previous
              fi
              sudo mv -f /etc/caddy/sites/voxbento.caddy.next /etc/caddy/sites/voxbento.caddy
              # Check the whole host configuration, including other apps' sites, before reload.
              # On failure, put the files back so a later reload or reboot still works.
              if ! sudo caddy validate --config /etc/caddy/Caddyfile; then
                echo "ERROR: host Caddy configuration is invalid with this release; restoring it"
                if sudo test -f /etc/caddy/sites/voxbento.caddy.previous; then
                  sudo mv -f /etc/caddy/sites/voxbento.caddy.previous /etc/caddy/sites/voxbento.caddy
                else
                  sudo rm -f /etc/caddy/sites/voxbento.caddy
                fi
                if [ -n "$caddy_migrated" ]; then
                  sudo mv -f /etc/caddy/Caddyfile.before-sites /etc/caddy/Caddyfile
                fi
                exit 1
              fi
              sudo systemctl reload caddy
              echo "Caddy config updated and reloaded"
            fi

            # ── Apply changes from docker-compose.yml ──────────────────────
            # Images were built and validated above. 'up' recreates changed services,
            # including the portal, so a second explicit restart is unnecessary.
            echo "--- docker compose up -d ---"
            compose up -d --no-build --remove-orphans

            # ── Wait for portal health ──────────────────────────────────────
            echo "--- waiting for portal health ---"
            for i in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$portal_port/healthz 2>/dev/null || echo "000")
              echo "  attempt $i/30: HTTP $status"
              if [ "$status" = "200" ]; then
                echo "Portal is healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: Portal did not become healthy within 90s"
                compose logs portal --tail=50
                exit 1
              fi
              sleep 3
            done

            # Keep the previous images available until the replacement stack is
            # healthy. This preserves rollback options during a failed rollout.
            # Only this project's images: other apps may share the Docker host.
            echo "--- cleaning up unused images ---"
            docker image prune -f --filter label=com.docker.compose.project=voxbento

            # The rootless Jitsi layout uses new volumes. Remove the five
            # pre-rootless generated-config volumes once no container uses them.
            echo "--- cleaning up legacy Jitsi volumes ---"
            for legacy_jitsi_volume in \
              voxbento_jitsi-web-config \
              voxbento_jitsi-prosody-config \
              voxbento_jitsi-prosody-plugins \
              voxbento_jitsi-jicofo-config \
              voxbento_jitsi-jvb-config; do
              if docker volume inspect "$legacy_jitsi_volume" >/dev/null 2>&1; then
                if docker volume rm "$legacy_jitsi_volume"; then
                  echo "Removed $legacy_jitsi_volume"
                else
                  echo "WARNING: Could not remove $legacy_jitsi_volume; it may still be in use"
                fi
              fi
            done

            echo "=== Deploy complete: $(date) ==="
            compose ps
