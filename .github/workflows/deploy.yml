name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  # Manual trigger for rollbacks / forced re-deploy
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy — finish it

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: SSH deploy → voxbento.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for reference — actual code pull happens on server)
        uses: actions/checkout@v7.0.1

      # ── SSH into the production server and pull latest code ──────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          # Timeout: 5 minutes (alembic migrations + docker restart can take ~60s)
          command_timeout: 5m
          script: |
            set -e

            echo "=== Deploying to production: $(date) ==="
            cd /home/ubuntu/voxbento

            # Validate in a separate checkout: the current portal may still bind
            # the live source directory until this deployment replaces it.
            deployment_dir="$PWD"
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch origin main
            candidate_commit=$(git rev-parse origin/main)
            candidate_dir=$(mktemp -d "${TMPDIR:-/tmp}/voxbento-deploy.XXXXXX")
            git worktree add --detach "$candidate_dir" "$candidate_commit"
            trap 'git -C "$deployment_dir" worktree remove --force "$candidate_dir"' EXIT
            cd "$candidate_dir"
            umask 077
            cp "$deployment_dir/.env" .env

            # Keep image tags, networks and persistent volumes under the existing
            # project name even when Compose runs in a temporary checkout.
            compose() { docker compose --project-name voxbento "$@"; }
            echo "--- building deployment images ---"
            compose build

            echo "--- validating production configuration ---"
            compose run --rm --no-deps portal \
              uv run python -c \
              "from portal.config import settings; settings.validate_production_secrets()"

            if [ -f Caddyfile ]; then
              sudo caddy validate --config Caddyfile --adapter caddyfile
            fi

            # YouTube relay mode lives in docker-compose.relay.yml, selected by COMPOSE_FILE
            # in .env. Never let a deploy without it remove a running relay (--remove-orphans).
            relay_running=$(docker ps -q --filter label=com.docker.compose.project=voxbento \
              --filter label=com.docker.compose.service=program-relay)
            if [ -n "$relay_running" ] && ! compose config --services | grep -qx program-relay; then
              echo "ERROR: program-relay is running but this deploy would remove it."
              echo "Add COMPOSE_FILE=docker-compose.yml:docker-compose.relay.yml to .env"
              echo "(or run scripts/setup-youtube-relay.sh), then re-run the deploy."
              exit 1
            fi

            # Only advance the live checkout after all preflight checks pass.
            cd "$deployment_dir"
            git checkout main
            git merge --ff-only "$candidate_commit"
            if [ -f Caddyfile ]; then
              sudo cp Caddyfile /etc/caddy/Caddyfile
              sudo systemctl reload caddy
              echo "Caddy config updated and reloaded"
            fi

            # ── Apply changes from docker-compose.yml ──────────────────────
            # Images were built and validated above. 'up' recreates changed services,
            # including the portal, so a second explicit restart is unnecessary.
            echo "--- docker compose up -d ---"
            compose up -d --no-build --remove-orphans

            # ── Wait for portal health ──────────────────────────────────────
            echo "--- waiting for portal health ---"
            for i in $(seq 1 30); do
              status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/healthz 2>/dev/null || echo "000")
              echo "  attempt $i/30: HTTP $status"
              if [ "$status" = "200" ]; then
                echo "Portal is healthy!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "ERROR: Portal did not become healthy within 90s"
                compose logs portal --tail=50
                exit 1
              fi
              sleep 3
            done

            # Keep the previous images available until the replacement stack is
            # healthy. This preserves rollback options during a failed rollout.
            echo "--- cleaning up unused images ---"
            docker image prune -f

            # The rootless Jitsi layout uses new volumes. Remove the five
            # pre-rootless generated-config volumes once no container uses them.
            echo "--- cleaning up legacy Jitsi volumes ---"
            for legacy_jitsi_volume in \
              voxbento_jitsi-web-config \
              voxbento_jitsi-prosody-config \
              voxbento_jitsi-prosody-plugins \
              voxbento_jitsi-jicofo-config \
              voxbento_jitsi-jvb-config; do
              if docker volume inspect "$legacy_jitsi_volume" >/dev/null 2>&1; then
                if docker volume rm "$legacy_jitsi_volume"; then
                  echo "Removed $legacy_jitsi_volume"
                else
                  echo "WARNING: Could not remove $legacy_jitsi_volume; it may still be in use"
                fi
              fi
            done

            echo "=== Deploy complete: $(date) ==="
            compose ps
