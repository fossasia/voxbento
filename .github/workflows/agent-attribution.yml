# .github/workflows/agent-attribution.yml
#
# Detects AI models and harnesses used to author PRs (matching the t3code convention)
# and ensures proper attribution in the PR description and an "ai-assisted" label.
#
# pull_request_target runs in the context of the base branch and gets a write-capable
# GITHUB_TOKEN so fork PRs can receive attribution labels and description updates.
# That is safe only because the script that runs always comes from the trusted
# default branch: pull_request_target checks out the base branch, and manual runs
# are limited to the default branch and check it out explicitly. PR text and
# commit messages are only ever read as data.

name: Agent Attribution

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] only trusted default-branch code runs; PR content is data
    types: [opened, ready_for_review, synchronize, reopened, edited]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to check or update attribution
        required: true
        type: number

concurrency:
  group: agent-attribution-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  attribute:
    runs-on: ubuntu-latest
    # Manual runs are only allowed from the default branch, so a run started on
    # another branch cannot execute that branch's script with this token.
    if: |
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.state == 'open' &&
       (github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'main'))
    steps:
      # SECURITY: always check out the trusted default branch. Never point `ref:`
      # at the pull request head or the dispatch ref; with this write token that
      # would run untrusted code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const rawPrNumber = context.payload.inputs.pr_number;
              const prNumber = Number(rawPrNumber);
              if (!Number.isSafeInteger(prNumber) || prNumber < 1) {
                core.setFailed('pr_number must be a positive integer.');
                return;
              }
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (data.state !== 'open' || data.merged_at || !['dev', 'main'].includes(data.base.ref)) {
                core.info('Skipping: only open, unmerged PRs targeting dev or main are eligible.');
                return;
              }
              context.payload.pull_request = {
                number: prNumber,
                state: data.state,
                base: { ref: data.base.ref },
              };
            }

            const { runAgentAttribution } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/agent-attribution-lib.mjs`
            );
            await runAgentAttribution({ github, context, core });
