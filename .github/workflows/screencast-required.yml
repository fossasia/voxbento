# .github/workflows/screencast-required.yml
#
# Enforces the "screencast required" rule on pull requests for all contributors.
#
# How it works:
#   1. When any PR is opened, reopened, marked ready for review, or manually labeled:
#      - If the PR already contains a video in its description or comments, no label is added.
#      - If no video is present, the bot posts a screencast request and adds "needs-screencast".
#      - Draft PRs are skipped until they are marked "Ready for review".
#      - Maintainers can also manually add the "needs-screencast" label at any time.
#   2. When a PR description is edited, new commits are pushed, or a comment is posted:
#      - If "needs-screencast" is present and a video is now detected (in description or comments),
#        "needs-screencast" is immediately removed and a confirmation comment is posted.
#   3. Every hour the bot checks every open PR with "needs-screencast":
#      - If a video was added -> "needs-screencast" is removed.
#      - No video after REMIND_AFTER_HOURS -> one reminder is posted.
#      - No video after CLOSE_AFTER_HOURS  -> closing message is posted and the PR is closed.
#   Maintainers can remove the label by hand at any time to bypass the requirement.

name: Screencast required

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, edited, synchronize]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 * * * *" # hourly, so closing happens close to the deadline
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would happen, do not comment or close"
        type: boolean
        default: false

permissions:
  pull-requests: write # enough to comment on, label and close PRs
  issues: write

env:
  LABEL: needs-screencast
  REMIND_AFTER_HOURS: "48"
  CLOSE_AFTER_HOURS: "72"

jobs:
  # Real-time sync: requests screencast when missing, or immediately removes label when video is added.
  sync:
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot') || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = process.env.LABEL;
            const hours = process.env.CLOSE_AFTER_HOURS;
            const APPROVED_MARKER = '<!-- screencast-approved -->';

            // Video detection helper
            const ASSET_RE = /https:\/\/github\.com\/user-attachments\/assets\/[\w-]+/gi;
            const LINK_RE = /https:\/\/[^\s)"'<>]+\.(mp4|mov|webm|mkv|avi|flv|m4v)\b|https:\/\/[^\s)"'<>]*(?:screencast|screen[-_]?recording|demo|preview)[^\s)"'<>]*\.gif\b|https:\/\/(www\.)?(youtube\.com|youtu\.be|loom\.com|vimeo\.com|streamable\.com|asciinema\.org|cleanshot\.cloud|drive\.google\.com\/(?:file\/d|open))\/\S+/i;

            const hasVideoText = body => {
              body = body ?? '';
              if (LINK_RE.test(body)) return true;
              for (const m of body.matchAll(ASSET_RE)) {
                const before = body.slice(Math.max(0, m.index - 500), m.index);
                if (/!\[[^\]]*\]\(\s*$/.test(before)) continue; // markdown image
                if (/<img\b[^>]*$/i.test(before)) continue;     // html image
                return true;
              }
              return false;
            };

            const isPrEvent = context.eventName === 'pull_request_target';
            const issueNumber = isPrEvent ? context.payload.pull_request.number : context.payload.issue.number;

            // Fetch live PR details to avoid cached or stale data
            const { data: currentPr } = await github.rest.pulls.get({
              owner, repo, pull_number: issueNumber,
            });

            if (currentPr.state === 'closed') {
              core.info(`#${issueNumber}: PR is closed, skipping`);
              return;
            }

            const author = currentPr.user.login;
            const labelsOnPr = (currentPr.labels ?? []).map(l => l.name);
            const hasScreencastLabel = labelsOnPr.includes(LABEL);

            // Fetch all comments on the PR to check for video links
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });

            const hasVideoInDescription = hasVideoText(currentPr.body);
            const hasVideoInComments = comments.some(c =>
              !c.user?.type?.includes('Bot') && !c.user?.login?.endsWith('[bot]') && hasVideoText(c.body)
            );
            const videoPresent = hasVideoInDescription || hasVideoInComments;

            // 1. If PR currently has the needs-screencast label AND a video is now present:
            // Remove the label immediately and confirm!
            if (hasScreencastLabel && videoPresent) {
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: issueNumber, name: LABEL,
              });
              const alreadyConfirmed = comments.some(c => c.body && c.body.includes(APPROVED_MARKER));
              if (!alreadyConfirmed) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: [
                    APPROVED_MARKER,
                    `Thank you @${author} for adding a screencast! The \`${LABEL}\` label has been removed and this PR is ready for maintainer review.`,
                  ].join('\n'),
                });
              }
              core.info(`#${issueNumber}: video detected, removed ${LABEL} label`);
              return;
            }

            // 2. If PR does NOT have needs-screencast label, check if we need to request one:
            if (!hasScreencastLabel && isPrEvent) {
              const action = context.payload.action;

              // Case A: Maintainer manually added the needs-screencast label
              if (action === 'labeled') {
                if (context.payload.label?.name !== LABEL) return;
                if (videoPresent) {
                  // Video already present, undo the label immediately
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: issueNumber, name: LABEL,
                  });
                  return;
                }
                const alreadyRequested = comments.some(c =>
                  c.body && c.body.includes('please add a **short screencast video**')
                );
                if (!alreadyRequested) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: issueNumber,
                    body: [
                      `Hi @${author}, thanks for your contribution!`,
                      ``,
                      `Before we can review this PR, please add a **short screencast video** showing the change working (before/after where relevant).`,
                      ``,
                      `If no video is added within **${hours} hours**, this PR will be closed automatically. You are welcome to reopen it or submit a new PR once you have the screencast.`,
                    ].join('\n'),
                  });
                  core.info(`#${issueNumber}: screencast request comment posted after label added`);
                }
                return;
              }

              // Case B: PR opened, reopened, or marked ready for review
              if (['opened', 'reopened', 'ready_for_review'].includes(action)) {
                if (currentPr.draft) {
                  core.info(`#${issueNumber}: draft PR, screencast will be requested when marked ready for review`);
                  return;
                }
                if (labelsOnPr.includes('pr-limit-reached')) {
                  core.info(`#${issueNumber}: pr-limit-reached, skipping screencast request`);
                  return;
                }
                if (videoPresent) {
                  core.info(`#${issueNumber}: description or comments already contain a video, no screencast request needed`);
                  return;
                }
                const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner, repo, issue_number: issueNumber, per_page: 100,
                });
                const hadScreencastLabel = events.some(e => e.event === 'labeled' && e.label?.name === LABEL);
                if (hadScreencastLabel) {
                  core.info(`#${issueNumber}: screencast was already requested on this PR before, leaving it to reviewers`);
                  return;
                }

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: [
                    `Hi @${author}, thanks for your contribution!`,
                    ``,
                    `Before we can review this PR, please add a **short screencast video** showing the change working (before/after where relevant).`,
                    ``,
                    `If no video is added within **${hours} hours**, this PR will be closed automatically. You are welcome to reopen it or submit a new PR once you have the screencast.`,
                  ].join('\n'),
                });
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber,
                  labels: [LABEL],
                });
                core.info(`#${issueNumber}: screencast requested and label added`);
              }
            }

  # Hourly check: remind, release or close.
  enforce:
    if: github.event_name != 'pull_request_target' && github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const LABEL = process.env.LABEL;
            const REMIND_HOURS = Number(process.env.REMIND_AFTER_HOURS);
            const CLOSE_HOURS = Number(process.env.CLOSE_AFTER_HOURS);
            const DRY_RUN = String(context.payload.inputs?.dry_run ?? 'false') === 'true';
            const REMIND_MARKER = '<!-- screencast-reminder -->';
            const CLOSE_MARKER = '<!-- screencast-closed -->';
            const APPROVED_MARKER = '<!-- screencast-approved -->';
            const HOUR = 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const now = Date.now();

            // Video detection helper
            const ASSET_RE = /https:\/\/github\.com\/user-attachments\/assets\/[\w-]+/gi;
            const LINK_RE = /https:\/\/[^\s)"'<>]+\.(mp4|mov|webm|mkv|avi|flv|m4v)\b|https:\/\/[^\s)"'<>]*(?:screencast|screen[-_]?recording|demo|preview)[^\s)"'<>]*\.gif\b|https:\/\/(www\.)?(youtube\.com|youtu\.be|loom\.com|vimeo\.com|streamable\.com|asciinema\.org|cleanshot\.cloud|drive\.google\.com\/(?:file\/d|open))\/\S+/i;

            const hasVideoText = body => {
              body = body ?? '';
              if (LINK_RE.test(body)) return true;
              for (const m of body.matchAll(ASSET_RE)) {
                const before = body.slice(Math.max(0, m.index - 500), m.index);
                if (/!\[[^\]]*\]\(\s*$/.test(before)) continue; // markdown image
                if (/<img\b[^>]*$/i.test(before)) continue;     // html image
                return true;
              }
              return false;
            };

            const act = async (msg, fn) => {
              core.info((DRY_RUN ? '[dry-run] ' : '') + msg);
              if (!DRY_RUN) await fn();
            };

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const targets = prs.filter(pr => (pr.labels ?? []).some(l => l.name === LABEL));
            core.info(`${targets.length} open PR(s) labelled "${LABEL}"`);

            // Process each PR separately
            const failed = [];
            for (const item of targets) {
              try {
                const n = item.number;
                // Fetch live PR data to ensure fresh body and details
                const { data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: n,
                });
                const author = pr.user.login;

                const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  owner, repo, issue_number: n, per_page: 100,
                });

                // Latest time the label was added
                const labelled = events.filter(e => e.event === 'labeled' && e.label?.name === LABEL);
                if (!labelled.length) continue;
                const requestedAt = new Date(labelled[labelled.length - 1].created_at).getTime();
                const after = ts => ts && new Date(ts).getTime() > requestedAt;

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: n, per_page: 100,
                });

                // Check whether video exists in PR description or any non-bot comment
                const videoInComments = comments.some(c =>
                  !c.user?.type?.includes('Bot') && !c.user?.login?.endsWith('[bot]') && hasVideoText(c.body)
                );
                const videoInDescription = hasVideoText(pr.body);

                if (videoInComments || videoInDescription) {
                  await act(`#${n}: video found ${videoInComments ? 'in comment' : 'in PR description'}, removing label`, async () => {
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: LABEL });
                    const alreadyConfirmed = comments.some(c => c.body && c.body.includes(APPROVED_MARKER));
                    if (!alreadyConfirmed) {
                      await github.rest.issues.createComment({
                        owner, repo, issue_number: n,
                        body: [
                          APPROVED_MARKER,
                          `Thank you @${author} for adding a screencast! The \`${LABEL}\` label has been removed and this PR is ready for maintainer review.`,
                        ].join('\n'),
                      });
                    }
                  });
                  continue;
                }

                const hoursWaiting = (now - requestedAt) / HOUR;

                if (hoursWaiting >= CLOSE_HOURS) {
                  const alreadyNotified = events.some(e =>
                    e.event === 'commented' && after(e.created_at) && (e.body ?? '').includes(CLOSE_MARKER));
                  await act(`#${n}: no response for ${hoursWaiting.toFixed(1)} hours, closing`, async () => {
                    if (!alreadyNotified) await github.rest.issues.createComment({
                      owner, repo, issue_number: n,
                      body: [
                        CLOSE_MARKER,
                        `Hi @${author}, we requested a screencast for this PR ${CLOSE_HOURS} hours ago and have not received a video, so we are closing it for now.`,
                        ``,
                        `This is not a judgement on the code. You are welcome to reopen this PR or open a new one once you can include a short screencast showing the change working. Thank you for your interest in contributing!`,
                      ].join('\n'),
                    });
                    await github.rest.pulls.update({ owner, repo, pull_number: n, state: 'closed' });
                    // Remove the label so a reopened PR is not closed again automatically.
                    await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name: LABEL });
                  });
                  continue;
                }

                const alreadyReminded = events.some(e =>
                  e.event === 'commented' && after(e.created_at) && (e.body ?? '').includes(REMIND_MARKER));

                if (hoursWaiting >= REMIND_HOURS && !alreadyReminded) {
                  const left = Math.max(1, Math.ceil(CLOSE_HOURS - hoursWaiting));
                  await act(`#${n}: posting reminder (${left} hours left)`, () =>
                    github.rest.issues.createComment({
                      owner, repo, issue_number: n,
                      body: `${REMIND_MARKER}\nHi @${author}, friendly reminder: please add a **short screencast video** to this PR. It will be closed automatically in about **${left} hours** if no video is added.`,
                    }));
                  continue;
                }

                core.info(`#${n}: waiting (${hoursWaiting.toFixed(1)} of ${CLOSE_HOURS} hours)`);
              } catch (err) {
                failed.push(item.number);
                core.warning(`#${item.number}: skipped because of an error: ${err.message}`);
              }
            }
            if (failed.length) {
              core.setFailed(`Could not process PR(s): ${failed.map(x => '#' + x).join(', ')}. They will be retried on the next run.`);
            }
