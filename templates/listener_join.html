{% extends "base.html" %}
{% block title %}Join {{ event.display_name }} | VoxBento{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', path='css/listener.css') }}?v={{ js_version }}" />{% endblock %}

{% block content %}
<div class="listener-join-container">
    <div class="listener-join-card">
        <div class="listener-join-header">
            <h1 class="listener-join-title">{{ event.display_name }}</h1>
            <p class="listener-join-desc">Enter the join code to access the listener page.</p>
        </div>

        {% if error %}
        <div class="listener-join-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/listener/{{ event.slug }}" method="GET" class="listener-join-form">
            <div>
                <label for="code" class="listener-join-label">Join Code</label>
                <input type="text" id="code" name="code" required
                    class="listener-join-input"
                    placeholder="Enter code here">
            </div>

            <button type="submit" class="listener-join-btn">
                Join Event
            </button>
        </form>
    </div>
</div>
{% endblock %}
