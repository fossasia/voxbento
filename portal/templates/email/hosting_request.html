<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;font-weight:700;color:#111827;">New hosting access request</h1>
<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#374151;"><strong>{{ requester_name }}</strong> ({{ requester_email }}) asked for hosting access on VoxBento.</p>
<table role="presentation" style="width:100%;border-collapse:collapse;margin:0 0 16px;border-top:1px solid #e5e7eb;"><tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px 12px 8px 0;font-size:13px;color:#6b7280;vertical-align:top;white-space:nowrap;">Organization</td><td style="padding:8px 0;font-size:14px;color:#111827;vertical-align:top;">{{ organization }}</td></tr><tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px 12px 8px 0;font-size:13px;color:#6b7280;vertical-align:top;white-space:nowrap;">Event</td><td style="padding:8px 0;font-size:14px;color:#111827;vertical-align:top;">{{ event_name }}</td></tr><tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px 12px 8px 0;font-size:13px;color:#6b7280;vertical-align:top;white-space:nowrap;">Event dates</td><td style="padding:8px 0;font-size:14px;color:#111827;vertical-align:top;">{{ event_dates }}</td></tr><tr style="border-bottom:1px solid #e5e7eb;"><td style="padding:8px 12px 8px 0;font-size:13px;color:#6b7280;vertical-align:top;white-space:nowrap;">Languages</td><td style="padding:8px 0;font-size:14px;color:#111827;vertical-align:top;">{{ languages }}</td></tr></table>
{% if message %}<div style="margin:0 0 16px;padding:12px 16px;border-radius:8px;background:#f3f4f6;font-size:15px;line-height:1.6;color:#374151;">{{ message }}</div>{% endif %}
<p style="margin:24px 0;"><a href="{{ review_url }}" style="display:inline-block;padding:12px 22px;border-radius:8px;background:#2563eb;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">Review request</a></p>
