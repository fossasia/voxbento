{% extends "base.html" %}
{% block title %}Join {{ event.display_name }} | VoxBento{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/listener-join.css') }}" />
{% endblock %}

{% block content %}
<div class="join-page">
  <div class="join-card">
    <div class="join-header">
      <h1 class="join-title">{{ event.display_name }}</h1>
      <p class="join-subtitle">Enter the join code to access the listener page.</p>
    </div>

    {% if error %}
    <div class="join-error">
      {{ error }}
    </div>
    {% endif %}

    <form action="/listener/{{ event.slug }}" method="GET">
      <div>
        <label for="code" class="join-label">Join Code</label>
        <input type="text" id="code" name="code" required class="join-input" placeholder="Enter code here">
      </div>

      <button type="submit" class="join-button">
        Join Event
      </button>
    </form>
  </div>
</div>
{% endblock %}
