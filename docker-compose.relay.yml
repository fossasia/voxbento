# Opt-in RTMPS ingest + YouTube relay (#749). Read docs/program-relay.md first.
#
# Set up with one command, which writes the settings below into .env:
#
#   scripts/setup-youtube-relay.sh
#
# The script adds COMPOSE_FILE=docker-compose.yml:docker-compose.relay.yml to .env,
# so plain `docker compose up -d` and the production deploy workflow always include
# this file. Without that line, the next deploy removes program-relay and closes 1936.
#
# Settings read from .env: MEDIAMTX_AUTH_HOOK_SECRET, PROGRAM_RELAY_CONTROL_SECRET
# (openssl rand -hex 32), PROGRAM_RTMPS_PUBLIC_BASE (e.g. rtmps://voxbento.com:1936),
# PROGRAM_RTMPS_CERT_DIR and PROGRAM_RTMPS_CERT_NAME (<name>.crt + <name>.key in that
# directory, e.g. Caddy's certificate directory for the hostname; MediaMTX reloads them
# when Caddy renews). Rollback: remove COMPOSE_FILE from .env and run
# `docker compose up -d --remove-orphans`; the WHIP dual-output mode is unaffected.
services:
  portal:
    environment:
      # Relay mode is a kind of program ingest, so it needs both switches.
      PROGRAM_INGEST_ENABLED: "true"
      PROGRAM_RELAY_ENABLED: "true"
      PROGRAM_RTMPS_PUBLIC_BASE: "${PROGRAM_RTMPS_PUBLIC_BASE:?set PROGRAM_RTMPS_PUBLIC_BASE, e.g. rtmps://voxbento.com:1936}"
      PROGRAM_RELAY_BASE: "http://program-relay:8090"
      PROGRAM_RELAY_CONTROL_SECRET: "${PROGRAM_RELAY_CONTROL_SECRET:?set PROGRAM_RELAY_CONTROL_SECRET (openssl rand -hex 32)}"
      PROGRAM_RELAY_MAX: "${PROGRAM_RELAY_MAX:-4}"
      PROGRAM_RELAY_ALLOWED_HOSTS: "${PROGRAM_RELAY_ALLOWED_HOSTS:-a.rtmps.youtube.com,b.rtmps.youtube.com}"

  mediamtx:
    environment:
      # TLS-only RTMP: "strict" opens the RTMPS listener and keeps plaintext RTMP closed.
      MTX_RTMP: "yes"
      MTX_RTMPENCRYPTION: "strict"
      MTX_RTMPSADDRESS: ":1936"
      MTX_RTMPSERVERKEY: "/certs/${PROGRAM_RTMPS_CERT_NAME:-rtmps}.key"
      MTX_RTMPSERVERCERT: "/certs/${PROGRAM_RTMPS_CERT_NAME:-rtmps}.crt"
    volumes:
      # A directory, not single files, so renewed certificates (new files) stay visible.
      - "${PROGRAM_RTMPS_CERT_DIR:?set PROGRAM_RTMPS_CERT_DIR (run scripts/setup-youtube-relay.sh)}:/certs:ro"
    ports:
      # Public contribution ingest. Every publish is checked by /internal/media-auth.
      - "1936:1936"

  # Media plane: RTSP from MediaMTX in, RTMPS to YouTube out. No published ports;
  # only the portal reaches its control API, authenticated with the shared secret.
  program-relay:
    build:
      context: ./program-relay
      dockerfile: Dockerfile
    environment:
      RELAY_CONTROL_SECRET: "${PROGRAM_RELAY_CONTROL_SECRET:?set PROGRAM_RELAY_CONTROL_SECRET}"
      RELAY_SOURCE_BASE: "rtsp://mediamtx:8554"
      RELAY_MAX: "${PROGRAM_RELAY_MAX:-4}"
      RELAY_ALLOWED_HOSTS: "${PROGRAM_RELAY_ALLOWED_HOSTS:-a.rtmps.youtube.com,b.rtmps.youtube.com}"
    depends_on:
      - mediamtx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
