# Opt-in RTMPS ingest + YouTube relay (#749). Read docs/program-relay.md first.
#
#   docker compose -f docker-compose.yml -f docker-compose.relay.yml config --quiet
#   docker compose -f docker-compose.yml -f docker-compose.relay.yml up -d
#
# Requires in .env: PROGRAM_INGEST_ENABLED=true, MEDIAMTX_AUTH_HOOK_SECRET,
# PROGRAM_RELAY_CONTROL_SECRET (openssl rand -hex 32), PROGRAM_RTMPS_PUBLIC_BASE
# (e.g. rtmps://voxbento.com:1936) and PROGRAM_RTMPS_CERT_DIR containing
# rtmps.crt + rtmps.key for that hostname. Rollback: drop this file from the
# command and recreate; the WHIP dual-output mode is unaffected.
services:
  portal:
    environment:
      PROGRAM_RELAY_ENABLED: "true"
      PROGRAM_RTMPS_PUBLIC_BASE: "${PROGRAM_RTMPS_PUBLIC_BASE:?set PROGRAM_RTMPS_PUBLIC_BASE, e.g. rtmps://voxbento.com:1936}"
      PROGRAM_RELAY_BASE: "http://program-relay:8090"
      PROGRAM_RELAY_CONTROL_SECRET: "${PROGRAM_RELAY_CONTROL_SECRET:?set PROGRAM_RELAY_CONTROL_SECRET (openssl rand -hex 32)}"
      PROGRAM_RELAY_MAX: "${PROGRAM_RELAY_MAX:-4}"
      PROGRAM_RELAY_ALLOWED_HOSTS: "${PROGRAM_RELAY_ALLOWED_HOSTS:-a.rtmps.youtube.com,b.rtmps.youtube.com}"

  mediamtx:
    environment:
      # TLS-only RTMP: "strict" opens the RTMPS listener and keeps plaintext RTMP closed.
      MTX_RTMP: "yes"
      MTX_RTMPENCRYPTION: "strict"
      MTX_RTMPSADDRESS: ":1936"
      MTX_RTMPSERVERKEY: "/certs/rtmps.key"
      MTX_RTMPSERVERCERT: "/certs/rtmps.crt"
    volumes:
      - "${PROGRAM_RTMPS_CERT_DIR:?set PROGRAM_RTMPS_CERT_DIR to a directory with rtmps.crt and rtmps.key}:/certs:ro"
    ports:
      # Public contribution ingest. Every publish is checked by /internal/media-auth.
      - "1936:1936"

  # Media plane: RTSP from MediaMTX in, RTMPS to YouTube out. No published ports;
  # only the portal reaches its control API, authenticated with the shared secret.
  program-relay:
    build:
      context: ./program-relay
      dockerfile: Dockerfile
    environment:
      RELAY_CONTROL_SECRET: "${PROGRAM_RELAY_CONTROL_SECRET:?set PROGRAM_RELAY_CONTROL_SECRET}"
      RELAY_SOURCE_BASE: "rtsp://mediamtx:8554"
      RELAY_MAX: "${PROGRAM_RELAY_MAX:-4}"
      RELAY_ALLOWED_HOSTS: "${PROGRAM_RELAY_ALLOWED_HOSTS:-a.rtmps.youtube.com,b.rtmps.youtube.com}"
    depends_on:
      - mediamtx
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
